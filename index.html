<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24212d">
<title>イケメンガチャ v6｜Prompt Maker</title>
<style>
:root{
  --bg:#17161d;--panel:#24222d;--panel2:#2d2a37;--line:#464150;
  --text:#f2eff6;--muted:#b7b0c2;--accent:#c7b4df;--accent2:#9180ad;
  --good:#b8c8bd;--danger:#d69da8;--shadow:0 14px 40px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 15% 0%,#302b3a 0,#1b1922 42%,var(--bg) 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
h1{font-size:clamp(25px,4vw,34px);font-weight:650;letter-spacing:.04em;margin:4px 0}
.subtitle{color:var(--muted);font-size:13px;margin:0}
.header-mark{color:#9587a9;font-size:28px;letter-spacing:.12em;white-space:nowrap}
.toolbar,.settings,.output,.category-card{background:rgba(36,34,45,.94);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
.toolbar{padding:14px;display:flex;flex-wrap:wrap;gap:9px;margin-bottom:13px}
.btn{border:1px solid #5a5267;color:var(--text);background:#373241;padding:9px 13px;border-radius:10px;font-size:13px;transition:.15s}
.btn:hover{background:#464052;border-color:#817395}
.btn.primary{background:#b8a6d0;border-color:#b8a6d0;color:#211d29;font-weight:700}
.btn.primary:hover{background:#d0c1e2}
.btn.ghost{background:transparent}
.btn.danger{color:#e7b7c0;border-color:#805c68;background:transparent}
.btn.small{padding:6px 9px;font-size:12px}
.toolbar .spacer{flex:1}
.settings{padding:13px 16px;margin-bottom:17px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.settings-title{font-size:12px;color:var(--muted);margin-right:2px}
.check{display:inline-flex;align-items:center;gap:7px;color:#ddd6e6;font-size:12px;cursor:pointer}
.check input{accent-color:#b8a6d0;width:15px;height:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.category-card{padding:15px;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.13)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-title{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px}
.num{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#393345;color:var(--accent);font-size:11px}
.card-actions{display:flex;gap:6px}
.lock{background:transparent;border:1px solid #625a6d;color:#bfb5ce;border-radius:8px;padding:5px 8px;font-size:11px}
.lock.active{background:#b8a6d0;color:#231e2a;border-color:#b8a6d0}
.reroll{background:transparent;border:1px solid #625a6d;color:#d5cadd;border-radius:8px;padding:5px 8px;font-size:11px}
.result-name{font-size:17px;font-weight:650;margin:0 0 5px;overflow-wrap:anywhere}
.result-prompt{margin:0;color:#bcb4c7;font-size:12px;line-height:1.65;overflow-wrap:anywhere}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:10px;border-top:1px solid #3c3846}
.count{font-size:11px;color:#92899d}
details{margin-top:11px}
summary{font-size:11px;color:#b9adc9;cursor:pointer;user-select:none}
.candidate-list{display:grid;gap:7px;margin-top:9px}
.candidate{border:1px solid #423e4c;background:#292632;padding:9px;border-radius:9px;display:flex;gap:8px;align-items:flex-start}
.candidate-main{flex:1;min-width:0}
.candidate-name{font-size:12px;font-weight:650}
.candidate-prompt{font-size:10px;color:#a9a1b4;overflow-wrap:anywhere;margin-top:2px}
.candidate-actions{display:flex;gap:4px;flex-shrink:0}
.candidate-actions button{font-size:10px;border:1px solid #5b5366;background:transparent;color:#d5cddd;border-radius:6px;padding:4px 6px}
.candidate-actions button:hover{background:#423c4e}
.advanced-tools{margin:0 0 17px;color:#aaa1b5;font-size:11px}
.advanced-tools summary{display:inline-block;padding:5px 2px;color:#9f96aa}
.advanced-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border:1px solid #393542;border-radius:10px;background:#211f28}
.output{margin-top:17px;padding:17px}
.output-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
h2{font-size:16px;margin:0;font-weight:650}
.output-note{color:var(--muted);font-size:11px;margin:4px 0 12px}
.field-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#d6cede;margin:11px 0 6px}
textarea{display:block;width:100%;min-height:102px;resize:vertical;background:#191820;border:1px solid #494352;border-radius:10px;color:#e9e3ef;padding:11px;font-size:12px;line-height:1.65}
textarea:focus,input:focus,select:focus{outline:2px solid #9884b5;outline-offset:1px}
.output-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
footer{color:#8f879a;font-size:10px;text-align:center;margin-top:22px}
dialog{width:min(540px,calc(100% - 28px));border:1px solid #62596d;border-radius:16px;background:#25222e;color:var(--text);padding:0;box-shadow:0 25px 80px #0009}
dialog::backdrop{background:#09080dbb;backdrop-filter:blur(4px)}
.modal-head{padding:17px 19px;border-bottom:1px solid #423d4a;display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:15px}
.modal-body{padding:17px 19px}
.form-row{display:grid;gap:6px;margin-bottom:13px}
.form-row label{font-size:12px;color:#c9c1d2}
.form-row input,.form-row textarea,.form-row select{width:100%;background:#191820;color:var(--text);border:1px solid #4d4658;border-radius:8px;padding:9px;font-size:13px}
.form-row textarea{min-height:85px}
.tag-options{display:flex;gap:7px 12px;flex-wrap:wrap;padding:9px;background:#1c1a23;border:1px solid #443e4d;border-radius:8px}
.modal-foot{padding:13px 19px;border-top:1px solid #423d4a;display:flex;justify-content:flex-end;gap:8px}
.empty{color:#a9a1b3;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e4d9ef;color:#26212e;padding:9px 15px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:700px){
 .app{padding:20px 13px 38px}
 header{align-items:flex-start}
 .header-mark{font-size:20px}
 .grid{grid-template-columns:1fr}
 .toolbar .spacer{display:none}
 .toolbar .btn{flex:1}
 .settings{gap:12px}
 .output-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">Character prompt generator</div>
      <h1>イケメンガチャ</h1>
      <p class="subtitle">世界観から組み立てる、男性キャラクター用プロンプトメーカー</p>
    </div>
    <div class="header-mark">✦ ✧ ✦</div>
  </header>

  <section class="toolbar">
    <button class="btn primary" id="allRoll">✦ 全項目を抽選</button>
    <button class="btn" id="unlockAll">固定をすべて解除</button>
  </section>
  <details class="advanced-tools"><summary>候補データ・詳細設定</summary>
    <div class="advanced-inner">
      <button class="btn small ghost" id="exportBtn">候補を保存（JSON）</button>
      <button class="btn small ghost" id="importBtn">候補を読み込む</button>
      <button class="btn small danger" id="resetDefaults">初期候補に戻す</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </details>

  <section class="settings">
    <span class="settings-title">プロンプト設定</span>
    <label class="check"><input type="checkbox" id="noPiercing" checked> ピアスを入れない</label>
    <label class="check"><input type="checkbox" id="noTattoo" checked> タトゥーを入れない</label>
    <label class="check"><input type="checkbox" id="noHighlights"> 瞳のハイライトを入れない</label>
  </section>

  <main class="grid" id="categoryGrid"></main>

  <section class="output">
    <div class="output-head">
      <div>
        <h2>生成された英語プロンプト</h2>
        <p class="output-note">PixAIなどに貼り付けて使える形式です。抽選結果を変更すると自動で更新されます。</p>
      </div>
      <button class="btn primary" id="copyAll">プロンプトをまとめてコピー</button>
    </div>
    <div class="field-label"><span>Positive prompt</span><button class="btn small" id="copyPositive">コピー</button></div>
    <textarea id="positive" spellcheck="false"></textarea>
    <div class="output-actions">
    </div>
  </section>
  <footer>候補と設定はこのブラウザ内に保存されます。JSON保存でバックアップできます。</footer>
</div>

<dialog id="editDialog">
  <form id="editForm" method="dialog">
    <div class="modal-head">
      <h2 id="dialogTitle">候補を追加</h2>
      <button class="btn small ghost" type="button" id="closeDialog">閉じる</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label for="candidateName">候補名（日本語・管理用）</label>
        <input id="candidateName" maxlength="50" required placeholder="例：淡いプラチナベージュ">
      </div>
      <div class="form-row">
        <label for="candidatePrompt">英語プロンプト</label>
        <textarea id="candidatePrompt" maxlength="500" required placeholder="例：soft platinum beige hair"></textarea>
      </div>
      <div class="form-row" id="worldGroupRow" hidden>
        <label for="worldGroup">服装候補との連動分類</label>
        <select id="worldGroup">
          <option value="modern">現代・都会</option>
          <option value="casual">現代・日常</option>
          <option value="academy">学園</option>
          <option value="japanese">和風</option>
          <option value="fantasy">西洋ファンタジー</option>
          <option value="gothic">ゴシック</option>
          <option value="scifi">近未来・SF</option>
          <option value="postapo">終末世界</option>
        </select>
      </div>
      <div class="form-row" id="outfitTagsRow" hidden>
        <label>この服装を抽選対象にする世界観</label>
        <div class="tag-options" id="outfitTags"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" id="cancelEdit">キャンセル</button>
      <button class="btn primary" type="submit" id="saveCandidate">保存</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

const STORAGE_KEY="ikemen-gacha-v7";

const $=s=>document.querySelector(s);
const clone=obj=>JSON.parse(JSON.stringify(obj));
const uid=()=> "custom_"+Math.random().toString(36).slice(2,10);
function load(){
 try{
  let raw=localStorage.getItem(STORAGE_KEY);
  const migrating=!raw;
  if(migrating)raw=localStorage.getItem("ikemen-gacha-v5");
  const saved=JSON.parse(raw);
  catalog=saved?.catalog||clone(DEFAULTS);
  selected=saved?.selected||{};
  locked=saved?.locked||{};
  if(migrating && Array.isArray(catalog.hairstyle)){
   const customHair=catalog.hairstyle.filter(x=>String(x.id).startsWith("custom_"));
   catalog.hairstyle=[...clone(DEFAULTS.hairstyle),...customHair];
   selected.hairstyle=null;
  }
 }catch(e){catalog=clone(DEFAULTS);selected={};locked={};}
 for(const c of CATEGORY_META){
  if(!Array.isArray(catalog[c.key]))catalog[c.key]=clone(DEFAULTS[c.key]);
  if(!catalog[c.key].length)catalog[c.key]=clone(DEFAULTS[c.key]);
  if(!catalog[c.key].some(x=>x.id===selected[c.key]))selected[c.key]=catalog[c.key][0].id;
  if(typeof locked[c.key]!=="boolean")locked[c.key]=false;
 }
}
function save(){
 // iOSのファイルプレビュー等でlocalStorageが利用できなくても、画面描画や抽選を止めない。
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify({catalog,selected,locked}));}
 catch(e){/* 保存領域が使えない環境では、この画面を開いている間だけメモリ上で保持 */}
}
function item(key){return catalog[key].find(x=>x.id===selected[key])||catalog[key][0];}
function currentWorld(){return item("world");}
function compatibleOutfits(world=currentWorld()){
 const groups=world?.group?[world.group]:(world?.groups||[]);
 return catalog.outfit.filter(o=>o.tags?.some(t=>groups.includes(t)));
}
function choose(arr){return arr[Math.floor(Math.random()*arr.length)];}
function setSelected(key,id){selected[key]=id;save();render();}
function randomizeKey(key){
 if(locked[key])return;
 if(key==="world" && locked.outfit){
  const tags=item("outfit")?.tags||[];
  const choices=catalog.world.filter(w=>(w.group?[w.group]:(w.groups||[])).some(g=>tags.includes(g)));
  if(!choices.length){toast("固定中の服装に合う世界観がありません");return;}
  const pool=choices.filter(x=>x.id!==selected.world);
  selected.world=(pool.length?choose(pool):choose(choices)).id;
 }else if(key==="outfit"){
  const arr=compatibleOutfits();
  if(!arr.length){toast("この世界観に対応する服装候補がありません");return;}
  const pool=arr.filter(x=>x.id!==selected.outfit);
  selected.outfit=(pool.length?choose(pool):choose(arr)).id;
 }else{
  const arr=catalog[key],pool=arr.filter(x=>x.id!==selected[key]);
  selected[key]=(pool.length?choose(pool):choose(arr)).id;
 }
 if(key==="world" && !locked.outfit){
  const arr=compatibleOutfits();
  if(arr.length){const pool=arr.filter(x=>x.id!==selected.outfit);selected.outfit=(pool.length?choose(pool):choose(arr)).id;}
 }
 save();render();
}
function randomizeAll(){
 // Outfit lock constrains the available world choices; otherwise world is chosen first.
 if(!locked.world){
  if(locked.outfit){
   const tags=item("outfit")?.tags||[];
   const valid=catalog.world.filter(w=>(w.group?[w.group]:(w.groups||[])).some(g=>tags.includes(g)));
   if(valid.length){const pool=valid.filter(w=>w.id!==selected.world);selected.world=(pool.length?choose(pool):choose(valid)).id;}
  }else{
   const pool=catalog.world.filter(w=>w.id!==selected.world);
   selected.world=(pool.length?choose(pool):choose(catalog.world)).id;
  }
 }
 for(const key of ["hairColor","hairstyle","faceShape","eyeShape","irisColor","build","mood"]){
  if(!locked[key]){const pool=catalog[key].filter(x=>x.id!==selected[key]);selected[key]=(pool.length?choose(pool):choose(catalog[key])).id;}
 }
 if(!locked.outfit){
  const arr=compatibleOutfits();
  if(arr.length){const pool=arr.filter(x=>x.id!==selected.outfit);selected.outfit=(pool.length?choose(pool):choose(arr)).id;}
 }
 save();render();
}

 $("#positive").value=promptText();

}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderCandidateList(key){
 const list=catalog[key];
 const candidates=list.map(c=>`
   <div class="candidate">
    <div class="candidate-main">
     <div class="candidate-name">${escapeHTML(c.name)}</div>
     <div class="candidate-prompt">${escapeHTML(c.prompt)}</div>
    </div>
    <div class="candidate-actions">
     <button data-use="${key}" data-id="${c.id}">選ぶ</button>
     <button data-edit="${key}" data-id="${c.id}">編集</button>
     <button data-delete="${key}" data-id="${c.id}" aria-label="削除">削除</button>
    </div>
   </div>`).join("");
 return `<button class="btn small" data-add="${key}">＋ 候補を追加</button>${candidates||'<p class="empty">候補がありません。</p>'}`;
}
function render(){
 const grid=$("#categoryGrid");
 grid.innerHTML=CATEGORY_META.map((meta,i)=>{
  const list=catalog[meta.key],cur=item(meta.key),isLock=locked[meta.key];
  return `<section class="category-card" data-category="${meta.key}">
   <div class="card-head">
    <div class="card-title"><span class="num">${String(i+1).padStart(2,"0")}</span>${meta.title}</div>
    <div class="card-actions">
     <button class="lock ${isLock?"active":""}" data-lock="${meta.key}">${isLock?"● 固定中":"○ 固定"}</button>
     <button class="reroll" data-reroll="${meta.key}">↻ 抽選</button>
    </div>
   </div>
   <p class="result-name">${escapeHTML(cur?.name||"未選択")}</p>
   <p class="result-prompt">${escapeHTML(cur?.prompt||"")}</p>
   <div class="card-foot"><span class="count">${list.length}候補 · ${escapeHTML(meta.note)}</span></div>
   <details data-candidates="${meta.key}"><summary>候補一覧・編集</summary><div class="candidate-list"></div></details>
  </section>`;
 }).join("");
 grid.querySelectorAll("details[data-candidates]").forEach(details=>{
  details.addEventListener("toggle",()=>{
   if(details.open && !details.dataset.loaded){
    details.querySelector(".candidate-list").innerHTML=renderCandidateList(details.dataset.candidates);
    details.dataset.loaded="true";
   }
  });
 });
 updatePrompts();
}
function toast(msg){
 const el=$("#toast");el.textContent=msg;el.classList.add("show");
 clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove("show"),1900);
}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);toast("コピーしました");}
 catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("コピーしました");}
}
function openEditor(key,id=null){
 editing={key,id};
 const existing=id?catalog[key].find(x=>x.id===id):null;
 $("#dialogTitle").textContent=existing?"候補を編集":"候補を追加";
 $("#candidateName").value=existing?.name||"";
 $("#candidatePrompt").value=existing?.prompt||"";
 $("#worldGroupRow").hidden=key!=="world";
 $("#outfitTagsRow").hidden=key!=="outfit";
 if(key==="world")$("#worldGroup").value=existing?.group||"modern";
 if(key==="outfit"){
  $("#outfitTags").innerHTML=GROUPS.map(([g,label])=>`<label class="check"><input type="checkbox" value="${g}" ${existing?.tags?.includes(g)?"checked":""}> ${label}</label>`).join("");
 }
 $("#editDialog").showModal();
}
function closeEditor(){$("#editDialog").close();editing=null;}
$("#categoryGrid").addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.lock){const k=t.dataset.lock;locked[k]=!locked[k];save();render();}
 else if(t.dataset.reroll)randomizeKey(t.dataset.reroll);
 else if(t.dataset.add)openEditor(t.dataset.add);
 else if(t.dataset.use)setSelected(t.dataset.use,t.dataset.id);
 else if(t.dataset.edit)openEditor(t.dataset.edit,t.dataset.id);
 else if(t.dataset.delete){
  const k=t.dataset.delete,id=t.dataset.id;
  if(catalog[k].length<=1){toast("各項目に最低1つの候補が必要です");return;}
  const target=catalog[k].find(x=>x.id===id);
  if(!confirm(`「${target?.name||"この候補"}」を削除しますか？`))return;
  catalog[k]=catalog[k].filter(x=>x.id!==id);
  if(selected[k]===id)selected[k]=catalog[k][0].id;
  save();render();
 }
});
$("#editForm").addEventListener("submit",e=>{
 e.preventDefault();if(!editing)return;
 const {key,id}=editing;
 const name=$("#candidateName").value.trim(),prompt=$("#candidatePrompt").value.trim();
 if(!name||!prompt)return;
 const data={id:id||uid(),name,prompt};
 if(key==="world")data.group=$("#worldGroup").value;
 if(key==="outfit"){
  data.tags=[...$("#outfitTags").querySelectorAll("input:checked")].map(x=>x.value);
  if(!data.tags.length){toast("対応する世界観を1つ以上選んでください");return;}
 }
 const idx=id?catalog[key].findIndex(x=>x.id===id):-1;
 if(idx>=0)catalog[key][idx]=data;else catalog[key].push(data);
 if(!id)selected[key]=data.id;
 // Editing a world may leave the current outfit incompatible; select a valid outfit automatically.
 if(key==="world" && !locked.outfit && !compatibleOutfits().some(x=>x.id===selected.outfit)){
  const valid=compatibleOutfits();if(valid.length)selected.outfit=choose(valid).id;
 }
 save();closeEditor();render();toast("候補を保存しました");
});
$("#closeDialog").addEventListener("click",closeEditor);
$("#cancelEdit").addEventListener("click",closeEditor);
$("#allRoll").addEventListener("click",randomizeAll);
$("#unlockAll").addEventListener("click",()=>{for(const k in locked)locked[k]=false;save();render();toast("すべての固定を解除しました");});
$("#noPiercing").addEventListener("change",updatePrompts);
$("#noTattoo").addEventListener("change",updatePrompts);
$("#noHighlights").addEventListener("change",updatePrompts);
$("#copyPositive").addEventListener("click",()=>copyText($("#positive").value));
$("#copyAll").addEventListener("click",()=>copyText($("#positive").value));
$("#exportBtn").addEventListener("click",()=>{
 const data={version:2,catalog,selected,locked};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="ikemen-gacha-candidates.json";a.click();URL.revokeObjectURL(url);toast("JSONを保存しました");
});
$("#importBtn").addEventListener("click",()=>$("#importFile").click());
$("#importFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text()),incoming=data.catalog||data;
  for(const c of CATEGORY_META){
   if(!Array.isArray(incoming[c.key])||!incoming[c.key].length)throw new Error("invalid");
  }
  catalog=incoming;selected=data.selected||{};locked=data.locked||{};
  for(const c of CATEGORY_META)if(!catalog[c.key].some(x=>x.id===selected[c.key]))selected[c.key]=catalog[c.key][0].id;
  if(!compatibleOutfits().some(x=>x.id===selected.outfit)){
   const valid=compatibleOutfits();if(valid.length)selected.outfit=valid[0].id;
  }
  save();render();toast("候補を読み込みました");
 }catch(err){alert("JSONを読み込めませんでした。イケメンガチャのJSONファイルを選択してください。");}
 e.target.value="";
});
$("#resetDefaults").addEventListener("click",()=>{
 if(!confirm("追加・編集した候補を含め、すべて初期状態に戻しますか？"))return;
 catalog=clone(DEFAULTS);selected={};locked={};
 for(const c of CATEGORY_META){selected[c.key]=catalog[c.key][0].id;locked[c.key]=false;}
 save();render();toast("初期候補に戻しました");
});
load();
if(!selected.world)for(const c of CATEGORY_META)selected[c.key]=catalog[c.key][0].id;
if(!compatibleOutfits().some(x=>x.id===selected.outfit)){
 const valid=compatibleOutfits();if(valid.length)selected.outfit=valid[0].id;
}
save();render();
</script>
</body>
</html>
